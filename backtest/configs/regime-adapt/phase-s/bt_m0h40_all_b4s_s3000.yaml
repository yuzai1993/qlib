# 由 run_regime_phase_s.py 生成，勿手改
run:
  mode: backtest_only
  note: phase_s_m0h40_all_b4s_s3000
  n_runs: 1
  from_session: 20260812_224058_regimeadaptfast_m0_s3000
  from_run: 1
  generate_figures: false
data:
  provider_uri: ~/.qlib/qlib_data/cn_data
  region: cn
  instruments: all
  benchmark:
    equal_weight_csv: backtest/configs/regime-adapt/bench_ew_all.csv
  handler:
    class: Alpha158Technical
    module_path: backtest.features.technical
    instruments:
      market: all
      filter_pipe:
      - filter_type: NameDFilter
        name_rule_re: ^(SH60|SH68|SZ00|SZ30)
        filter_start_time: null
        filter_end_time: null
    start_time: '2020-02-03'
    end_time: '2026-07-31'
    fit_start_time: '2020-02-03'
    fit_end_time: '2020-08-03'
    feature_groups:
    - range
    infer_processors:
    - class: ProcessInf
    label:
    - - Ref($close, -41)/Ref($close, -1)-1
    - - LABEL0
    learn_processors:
    - class: DropnaLabel
segments:
  train:
  - '2020-02-03'
  - '2020-07-31'
  valid:
  - '2020-08-03'
  - '2026-07-31'
  test:
  - '2020-08-03'
  - '2026-07-31'
model:
  class: RegimeSingleLGBMModel
  module_path: backtest.models.regime_adapt
strategy:
  class: TopkDropoutStrategy
  module_path: qlib.contrib.strategy.signal_strategy
  topk: 22
  n_drop: 2
  hold_thresh: 2
  kwargs:
    risk_degree: 0.9
    only_tradable: false
    forbid_all_trade_at_limit: false
backtest:
  account: 10000000
  exchange_kwargs:
    freq: day
    deal_price: close
    limit_threshold: 0.095
    open_cost: 0.00021
    close_cost: 0.00071
    min_cost: 5.0
    trade_unit: 100
