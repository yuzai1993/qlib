# EXPERIMENT_STANDARD v1.6 | exp: model-arch/double-ensemble | seed 42
# /opt/anaconda3/envs/qlib/bin/python backtest/scripts/run_backtest.py --config model-arch/double-ensemble/ma_double_ensemble_s42.yaml
run:
  mode: train_only
  note: ma_double_ensemble_s42
  n_runs: 1
  from_session: null
  from_run: 1
  generate_figures: false
data:
  provider_uri: ~/.qlib/qlib_data/cn_data
  region: cn
  instruments: csi1000
  benchmark: SH000852
  handler:
    class: Alpha158Technical
    module_path: backtest.features.technical
    start_time: '2003-01-02'
    end_time: '2026-07-16'
    fit_start_time: '2016-01-02'
    fit_end_time: '2020-01-10'
    infer_processors:
    - class: ProcessInf
    label:
    - - Ref($close, -41)/Ref($close, -1)-1
    - - LABEL0
    feature_groups:
    - range
segments:
  train:
  - '2016-01-02'
  - '2020-01-10'
  valid:
  - '2020-01-13'
  - '2021-07-15'
  test:
  - '2021-07-16'
  - '2026-07-16'
model:
  class: DEnsembleModel
  module_path: qlib.contrib.model.double_ensemble
  kwargs:
    base_model: gbm
    loss: mse
    num_models: 3
    enable_sr: true
    enable_fs: true
    alpha1: 1
    alpha2: 1
    bins_sr: 10
    bins_fs: 5
    decay: 0.5
    sample_ratios:
    - 0.8
    - 0.7
    - 0.6
    - 0.5
    - 0.4
    sub_weights:
    - 1
    - 1
    - 1
    epochs: 28
    colsample_bytree: 0.8879
    learning_rate: 0.2
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    max_depth: 8
    num_leaves: 210
    num_threads: 8
    seed: 42
strategy:
  class: TopkDropoutStrategy
  module_path: qlib.contrib.strategy.signal_strategy
  topk: 10
  n_drop: 2
  kwargs:
    hold_thresh: 1
    risk_degree: 0.95
    only_tradable: false
    forbid_all_trade_at_limit: false
backtest:
  account: 1000000
  exchange_kwargs:
    freq: day
    deal_price: close
    limit_threshold: 0.095
    open_cost: 0.00021
    close_cost: 0.00071
    min_cost: 5
    trade_unit: 100
dataset:
  class: PurgedHorizonDataset
  module_path: backtest.label_design.dataset
  kwargs:
    label_horizon: 40
