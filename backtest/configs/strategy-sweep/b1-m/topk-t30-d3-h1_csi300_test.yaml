run:
  mode: pred_backtest
  note: phase_s_topk-t30-d3-h1_csi300_test
  n_runs: 1
  generate_figures: false
data:
  provider_uri: ~/.qlib/qlib_data/cn_data
  region: cn
  instruments: csi300
  benchmark: SH000300
  handler:
    class: Alpha158
    module_path: qlib.contrib.data.handler
    start_time: '2003-01-02'
    end_time: '2026-07-31'
    fit_start_time: '2016-01-02'
    fit_end_time: '2020-01-10'
    infer_processors:
    - class: ProcessInf
segments:
  train:
  - '2016-01-02'
  - '2020-01-10'
  valid:
  - '2020-01-13'
  - '2021-07-15'
  test:
  - '2021-07-16'
  - '2026-07-31'
model:
  class: LGBModel
  module_path: qlib.contrib.model.gbdt
  kwargs:
    loss: mse
    colsample_bytree: 0.8879
    learning_rate: 0.2
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    max_depth: 8
    num_leaves: 210
    num_threads: 8
    seed: 2000
strategy:
  class: TopkDropoutStrategy
  module_path: qlib.contrib.strategy.signal_strategy
  topk: 30
  n_drop: 3
  hold_thresh: 1
  kwargs:
    risk_degree: 0.95
    only_tradable: false
    forbid_all_trade_at_limit: false
backtest:
  account: 500000
  exchange_kwargs:
    freq: day
    deal_price: close
    limit_threshold: 0.095
    open_cost: 0.00021
    close_cost: 0.00071
    min_cost: 5.0
    trade_unit: 100
phase_s:
  candidate_id: topk-t30-d3-h1
  selection_segment: test
  pool: csi300
