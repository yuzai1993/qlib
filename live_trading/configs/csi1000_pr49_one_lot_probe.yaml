# Operator-only prType=49 one-lot probe.  It deliberately has no model or
# parity section, so generic strategy prediction/publishing cannot use it.

account:
  opening_cash: 1000000.0
  opening_value_adjustment: 0.0

live:
  kind: "OPERATOR_PROBE"
  bridge_root: "/Volumes/qmt_bridge/pr49_probe"
  strategy_id: "csi1000_pr49_one_lot_probe"
  main_strategy_id: "csi1000_b6m_b2s_postclose_real"
  account_id: ""
  account_type: "STOCK"
  broker_environment: "REAL"
  allow_real_money: true
  default_mode: "LIVE"
  execution_session: "AFTER_HOURS_FIXED_PRICE"
  close_auction_price_type: 49
  submit_after: "15:00:05"
  cancel_at: "15:28:00"
  finalize_at: "15:30:00"
  snapshot_after: "15:31:00"
  max_orders_per_day: 100

storage:
  db_path: "live_trading/data/csi1000_b6m_b2s_postclose_real.db"

fees:
  commission_rate: 0.00020
  min_commission: 5.0
  stamp_duty_rate: 0.0005
  transfer_fee_rate: 0.00001
  dividend_tax_rate: 0.20

monitor:
  benchmark: "SH000852"
  benchmark_name: "中证1000"
  notify:
    channel: "serverchan"
    daily_report: true
  thresholds:
    daily_loss: -0.03
    consecutive_loss_days: 5
    reject_rate: 0.5
    cash_tolerance: 100.0
  broker_reconcile:
    cash_check: true
