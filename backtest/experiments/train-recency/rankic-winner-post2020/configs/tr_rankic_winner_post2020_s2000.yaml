# EXPERIMENT_STANDARD v1.9 | exp: train-recency/rankic-winner-post2020 | seed 2000
# /opt/anaconda3/envs/qlib/bin/python backtest/scripts/run_backtest.py --config train-recency/rankic-winner-post2020/tr_rankic_winner_post2020_s2000.yaml
run:
  mode: train_only
  note: tr_rankic_winner_post2020_s2000
  n_runs: 1
  from_session: null
  from_run: 1
  generate_figures: false
data:
  provider_uri: ~/.qlib/qlib_data/cn_data
  region: cn
  instruments: csi1000
  benchmark: SH000852
  handler:
    class: Alpha158Technical
    module_path: backtest.features.technical
    start_time: '2003-01-02'
    end_time: '2026-07-16'
    fit_start_time: '2016-01-02'
    fit_end_time: '2022-12-30'
    infer_processors:
    - class: ProcessInf
    label:
    - - Ref($close, -41)/Ref($close, -1)-1
    - - LABEL0
    feature_groups:
    - range
    learn_processors:
    - class: DropnaLabel
    - class: CSRankNorm
      kwargs:
        fields_group: label
segments:
  train:
  - '2016-01-02'
  - '2022-12-30'
  valid:
  - '2023-01-03'
  - '2024-06-28'
  test:
  - '2024-07-01'
  - '2026-07-16'
model:
  class: RankICEarlyStoppingDEnsembleModel
  module_path: backtest.models.rankic_early_stop
  kwargs:
    base_model: gbm
    loss: mse
    num_models: 3
    enable_sr: true
    enable_fs: true
    alpha1: 1
    alpha2: 1
    bins_sr: 10
    bins_fs: 5
    decay: 0.5
    sample_ratios:
    - 0.8
    - 0.7
    - 0.6
    - 0.5
    - 0.4
    sub_weights:
    - 1
    - 1
    - 1
    epochs: 200
    colsample_bytree: 0.8879
    learning_rate: 0.1
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    max_depth: 8
    num_leaves: 210
    num_threads: 8
    seed: 2000
    early_stopping_rounds: 20
    valid_segment:
    - '2023-01-03'
    - '2024-06-28'
    test_segment:
    - '2024-07-01'
    - '2026-07-16'
    protocol_id: post2020-forward-v1
strategy:
  class: TopkDropoutStrategy
  module_path: qlib.contrib.strategy.signal_strategy
  topk: 10
  n_drop: 2
  kwargs:
    hold_thresh: 1
    risk_degree: 0.95
    only_tradable: false
    forbid_all_trade_at_limit: false
backtest:
  account: 1000000
  exchange_kwargs:
    freq: day
    deal_price: close
    limit_threshold: 0.095
    open_cost: 0.00021
    close_cost: 0.00071
    min_cost: 5
    trade_unit: 100
dataset:
  class: PurgedHorizonDataset
  module_path: backtest.label_design.dataset
  kwargs:
    label_horizon: 40
